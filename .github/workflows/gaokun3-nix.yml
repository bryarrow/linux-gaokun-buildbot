# The main CI for the NixOS side. It evaluates on pull requests and builds +
# pushes to the project cache on the branches below, which is what keeps
# devices from compiling the kernel locally.
#
# The runner has to be arm64: linux-gaokun3's meta.platforms is aarch64, so an
# x86_64 runner either skips its checks or cross-compiles under emulation.
name: NixOS gaokun3

on:
  workflow_dispatch:
  pull_request:
  push:
    # main is the release branch; gaokun3-nix is where this work lands first.
    branches: [main, gaokun3-nix]
    paths:
      - '**.nix'
      - 'flake.lock'
      - '.github/workflows/gaokun3-nix.yml'
      - 'patches/**'
      - 'dts/**'
      - 'firmware/**'
      - 'tools/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Enables nix-command and flakes itself.
      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Set up the gaokun3 binary cache
        uses: cachix/cachix-action@v17
        with:
          name: gaokun3
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # The kernel's -dev output carries the whole source tree and is the
          # largest single item a build produces; no device needs it. Cachix
          # does not store paths that cache.nixos.org already has, so the
          # nixpkgs closure in these builds does not count against the quota.
          pushFilter: '(-dev$|-source$|linux-gaokun3-src)'
          # Forks do not receive the token and only main may populate the
          # cache, so pull requests pull but never push.
          skipPush: ${{ github.event_name == 'pull_request' }}

      # `nix flake check --no-build` only evaluates, so a kernel config
      # regression could not be caught here. config-symbols builds the
      # configfile alone (minutes, no kernel compile) and asserts that the
      # delta in nix/config/gaokun3-extra.nix landed.
      - name: Evaluate and check the kernel config (pull request)
        if: github.event_name == 'pull_request'
        run: |
          nix flake check --no-build
          nix build --no-link '.#checks.aarch64-linux.config-symbols'

      # checks.packages forces the base package outputs, so this is the build
      # that populates the cache. The Cachix daemon pushes store paths as they
      # are built; no separate `cachix push` is needed. The EL2 kernel is a
      # second full compile and lives in the parallel `el2` job below.
      - name: Check, build and push (main and manual runs)
        if: github.event_name != 'pull_request'
        run: nix flake check

      # Keep the base kernel and its modules against Cachix's LRU collection.
      # The pin name is stable and the script adds a revision only when the
      # store path changed, so three distinct generations survive.
      - name: Pin the base kernel against cache eviction
        if: github.event_name != 'pull_request'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          ./nix/ci/pin-kernel.sh gaokun3 base-kernel \
            "$(nix eval --raw '.#packages.aarch64-linux.linux-gaokun3.outPath')"
          ./nix/ci/pin-kernel.sh gaokun3 base-modules \
            "$(nix eval --raw '.#packages.aarch64-linux.linux-gaokun3.modules.outPath')"

  # linux-gaokun3-el2 is a second complete kernel tree, not a rebuild of the
  # base objects. It is excluded from checks.packages so this job can build it
  # concurrently with the base check: wall-clock time is the slower of the two
  # kernels rather than their sum, and both jobs push to the same cache. The
  # cost is another runner for the duration of the build.
  el2:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Set up the gaokun3 binary cache
        uses: cachix/cachix-action@v17
        with:
          name: gaokun3
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: '(-dev$|-source$|linux-gaokun3-src)'
          skipPush: false

      - name: Build the EL2 kernel and its modules
        run: |
          nix build --no-link \
            '.#packages.aarch64-linux.linux-gaokun3-el2' \
            '.#packages.aarch64-linux.linux-gaokun3-el2.modules'

      # EL2 modules are the coldest kernel output; without a pin they are the
      # first thing Cachix evicts when the free 5 GB cache is full.
      - name: Pin the EL2 kernel against cache eviction
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          ./nix/ci/pin-kernel.sh gaokun3 el2-kernel \
            "$(nix eval --raw '.#packages.aarch64-linux.linux-gaokun3-el2.outPath')"
          ./nix/ci/pin-kernel.sh gaokun3 el2-modules \
            "$(nix eval --raw '.#packages.aarch64-linux.linux-gaokun3-el2.modules.outPath')"
