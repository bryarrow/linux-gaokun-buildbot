# The main CI for the NixOS side. It evaluates on pull requests and builds +
# pushes to the project cache on main, which is what keeps devices from
# compiling the kernel locally. The Fedora workflows are separate and frozen.
#
# The runner has to be arm64: linux-gaokun3's meta.platforms is aarch64, so an
# x86_64 runner either skips its checks or cross-compiles under emulation.
name: NixOS gaokun3

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**.nix'
      - 'flake.lock'
      - '.github/workflows/gaokun3-nix.yml'
      - 'patches/**'
      - 'dts/**'
      - 'defconfig/**'
      - 'firmware/**'
      - 'tools/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Enables nix-command and flakes itself.
      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Set up the gaokun3 binary cache
        uses: cachix/cachix-action@v17
        with:
          name: gaokun3
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # The kernel's -dev output carries the whole source tree and is the
          # largest single item a build produces; no device needs it. Cachix
          # does not store paths that cache.nixos.org already has, so the
          # nixpkgs closure in these builds does not count against the quota.
          pushFilter: '(-dev$|-source$|linux-gaokun3-src)'
          # Forks do not receive the token and only main may populate the
          # cache, so pull requests pull but never push.
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Evaluate only (pull request)
        if: github.event_name == 'pull_request'
        run: nix flake check --no-build

      # checks.packages forces every package output, so this is the build that
      # populates the cache. The Cachix daemon pushes store paths as they are
      # built; no separate `cachix push` is needed.
      - name: Check, build and push (main and manual runs)
        if: github.event_name != 'pull_request'
        run: nix flake check
